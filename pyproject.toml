[project]
name = "riverbank"
version = "0.1.0"
description = "Multi-symbol quantitative market maker for Binance USD-M futures (see SPEC.md)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "orjson>=3.10",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "sortedcontainers>=2.4",
    "cryptography>=43",
    "matplotlib>=3.9",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riverbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["network: test needs public network access (skipped unless RIVERBANK_NETWORK_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM114", "SIM108"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["riverbank.core.*", "riverbank.risk.*", "riverbank.orders.*"]
strict = true

[[tool.mypy.overrides]]
module = ["sortedcontainers.*", "pyarrow.*", "uvloop.*", "matplotlib.*"]
ignore_missing_imports = true
