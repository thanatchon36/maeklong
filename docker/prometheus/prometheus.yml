# Scrapes the riverbank bots on the compose network. A bot that is not running (e.g. demo without its
# profile) simply shows as down. The `bot` label drives the Grafana dashboard's selector.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: riverbank
    static_configs:
      - targets: ["shadow:9108"]
        labels: {bot: shadow}
      - targets: ["demo:9109"]
        labels: {bot: demo}
      # live runs on the host with uv (no compose service, RUNBOOK §10): reached via the host gateway
      - targets: ["host.docker.internal:9110"]
        labels: {bot: live}
