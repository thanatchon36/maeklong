name: Bug report
description: Something behaves wrong in replay, shadow or demo
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste API keys, secrets or account IDs.** Redact log lines before posting."
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [replay / tests, shadow, demo, live]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed vs expected. Include the risk state (OK / REDUCE_ONLY / HALTED) if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The relevant structured log lines (event names, UTC timestamps).
      render: json
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse --short HEAD
